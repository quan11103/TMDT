services:

  # ─── POSTGRESQL DATABASE ─────────────────────────────────
  db:
    image: postgres:16
    container_name: tmdt_db
    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: abc123
      POSTGRES_DB: tmdt_db

    command: postgres -c shared_buffers=128MB -c max_connections=20

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

    mem_limit: 128m
    cpus: "0.30"

    # Không public DB nếu không cần
    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/docker/postgres-init:/docker-entrypoint-initdb.d:ro

    networks:
      - tmdt_network

  # ─── NESTJS APP (BACKEND) ────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: dockerfile

    container_name: tmdt_backend
    restart: always

    depends_on:
      db:
        condition: service_healthy

    env_file:
      - ./backend/.env
    mem_limit: 550m
    cpus: "1.30"

    volumes:
      - ./backend:/app
      - /app/node_modules

    command: sh -c "npx prisma db push && npm run start"

    ports:
      - "3000:3000"

    networks:
      - tmdt_network

  # ─── REACT APP (FRONTEND) ────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: tmdt_frontend
    restart: always

    environment:
      TZ: Asia/Ho_Chi_Minh

    volumes:
      - ./frontend:/app
      - /app/node_modules

    ports:
      - "5173:5173"

    depends_on:
      - backend

    networks:
      - tmdt_network

  # ─── NGINX REVERSE PROXY ─────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: tmdt_nginx
    restart: always

    mem_limit: 64m
    cpus: "0.10"

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - frontend
      - backend

    networks:
      - tmdt_network

volumes:
  postgres_data:
    name: tmdt_postgres_data

networks:
  tmdt_network:
    driver: bridge
