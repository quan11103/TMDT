services:

  # ─── POSTGRESQL DATABASE ─────────────────────────────────
  # Dùng image Debian (không dùng -alpine) để có đủ postgresql-contrib / extension unaccent
  # cho tìm kiếm không dấu (products.service raw SQL).
  db:
    image: postgres:18
    container_name: tmdt_db
    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: tmdt_db
      PGDATA: /var/lib/postgresql/data/pgdata

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Chỉ chạy khi tạo DB lần đầu (volume rỗng). DB cũ: prisma migrate hoặc psql CREATE EXTENSION.
      - ./backend/docker/postgres-init:/docker-entrypoint-initdb.d:ro

    networks:
      - tmdt_network

  # ─── NESTJS APP (BACKEND) ────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: dockerfile

    container_name: tmdt_backend
    restart: always

    depends_on:
      - db

    env_file:
      - ./backend/.env

    environment:
      DATABASE_URL: postgresql://postgres:12345@db:5432/tmdt_db
      JWT_SECRET: secret
      JWT_EXPIRES_IN: 1d
      PORT: 3000
      FRONTEND_URL: http://localhost:5173
      ADMIN_PASSWORD: 123456

    volumes:
      - ./backend:/app
      - /app/node_modules

    command: sh -c "npx prisma db push && npm run start:dev"

    ports:
      - "3000:3000"

    networks:
      - tmdt_network

  # ─── REACT APP (FRONTEND) ────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tmdt_frontend
    restart: always
    environment:
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "4173:4173"
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - tmdt_network

  # ─── NGINX REVERSE PROXY ─────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: tmdt_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - tmdt_network

volumes:
  postgres_data:
    name: tmdt_postgres_data

networks:
  tmdt_network:
    driver: bridge
