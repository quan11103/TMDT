version: '3.8'

services:

  # ─── POSTGRESQL DATABASE ─────────────────────────────────
  db:
    image: postgres:16
    container_name: tmdt_db
    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: abc123
      POSTGRES_DB: tmdt_db

    # Tối ưu: Hạ shared_buffers xuống 64MB để tương thích với dung lượng RAM của container
    command: postgres -c shared_buffers=64MB -c max_connections=20

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

    # Tối ưu: Tăng giới hạn RAM lên 256m để Postgres có không gian xử lý các connection
    mem_limit: 256m
    cpus: "0.30"

    # Lưu ý: Nếu thực sự không cần kết nối DB từ app ngoài (như DBeaver/TablePlus) ở máy host, 
    # bạn có thể comment block ports này lại để bảo mật hơn.
    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/docker/postgres-init:/docker-entrypoint-initdb.d:ro

    networks:
      - tmdt_network

  # ─── NESTJS APP (BACKEND) ────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: dockerfile

    container_name: tmdt_backend
    restart: always

    depends_on:
      db:
        condition: service_healthy

    env_file:
      - ./backend/.env

    environment:
      - DATABASE_URL=postgresql://postgres:abc123@db:5432/tmdt_db
      # SỬA LỖI: Cấp 1GB RAM cho cơ chế dọn rác (Garbage Collection) của Node.js
      - NODE_OPTIONS=--max-old-space-size=1024

    # SỬA LỖI: Nới rộng trần RAM container lên 1.5GB để NestJS compile thoải mái không lo bị Docker chém
    mem_limit: 1500m
    cpus: "1.30"

    volumes:
      - ./backend:/app
      - /app/node_modules
      # Giữ file upload (banner/sản phẩm) khi redeploy container
      - backend_uploads:/app/uploads

    command: sh -c "npx prisma db push && npm run start"

    ports:
      - "3000:3000"

    networks:
      - tmdt_network

  # ─── REACT APP (FRONTEND) ────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: tmdt_frontend
    restart: always

    environment:
      TZ: Asia/Ho_Chi_Minh

    volumes:
      - ./frontend:/app
      - /app/node_modules

    ports:
      - "5173:5173"

    depends_on:
      - backend

    networks:
      - tmdt_network

  # ─── NGINX REVERSE PROXY ─────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: tmdt_nginx
    restart: always

    mem_limit: 64m
    cpus: "0.10"

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - frontend
      - backend

    networks:
      - tmdt_network

volumes:
  postgres_data:
    name: tmdt_postgres_data
  backend_uploads:
    name: tmdt_backend_uploads

networks:
  tmdt_network:
    driver: bridge
